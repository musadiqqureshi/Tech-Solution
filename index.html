<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Tech Solutions — Software, Web & App Development | Pakistan</title>
    <meta name="description" content="Tech Solutions is a software studio in Pakistan crafting scalable web & mobile apps, custom software, AI automation, and content writing. Serving clients worldwide." />
    <meta name="keywords" content="software development Pakistan, web development Pakistan, app development, AI automation, custom software, tech solutions, mobile app development, AI agents, chatbots" />
    <meta name="author" content="Tech Solutions" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://tech-solutions.site/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tech-solutions.site/" />
    <meta property="og:title" content="Tech Solutions — Software, Web & App Development | Pakistan" />
    <meta property="og:description" content="We build scalable web & mobile applications, custom software, AI automation, and sharp content — engineered to grow your business." />
    <meta property="og:image" content="https://tech-solutions.site/og-image.png" />
    <meta property="og:site_name" content="Tech Solutions" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tech-solutions.site/" />
    <meta name="twitter:title" content="Tech Solutions — Software, Web & App Development | Pakistan" />
    <meta name="twitter:description" content="We build scalable web & mobile applications, custom software, AI automation, and sharp content — engineered to grow your business." />
    <meta name="twitter:image" content="https://tech-solutions.site/og-image.png" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="PK" />
    <meta name="geo.placename" content="Pakistan" />
    <meta name="language" content="English" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#7c3aed" />

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Structured Data — Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Tech Solutions",
      "url": "https://tech-solutions.site",
      "logo": "https://tech-solutions.site/favicon.svg",
      "description": "Software studio crafting scalable web & mobile applications, custom software, AI automation, and research content.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "PK"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://tech-solutions.site/#contact"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Tech Solutions Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Web Development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mobile App Development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Automation & Workflows" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Agents & Chatbots" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom Software Development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Content & Research Writing" } }
        ]
      }
    }
    </script>

    <!-- Structured Data — WebSite with Sitelinks Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Tech Solutions",
      "url": "https://tech-solutions.site"
    }
    </script>

    <!-- jsPDF deferred so it doesn't block render -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
